# Daily refresh of the sources that publish new data (SEC, FRED, CPSC, ENERGY STAR).
# It never touches the category review data or forecasts. If any check fails, nothing is committed and the
# site keeps showing the last good data. A commit to main makes Vercel redeploy automatically.
name: Refresh live data

on:
  schedule:
    - cron: "17 6 * * *"        # every day, 06:17 UTC
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild market and recent-activity data
        env:
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/build_market_data.py
          python scripts/build_recent_activity.py
      - name: Check the refreshed data
        run: python scripts/check_live_data.py
      - name: Commit if the sources changed
        run: |
          # the "built" date changes every run, so only publish when a source file actually changed
          if git diff --quiet -- data/external; then
            echo "No new source data today; nothing to publish."
            git checkout -- web
            exit 0
          fi
          git config user.name "data-refresh-bot"
          git config user.email "data-refresh-bot@users.noreply.github.com"
          git add data/external web/market.json web/recent.json
          git commit -m "data: scheduled refresh ($(date -u +%F))"
          git push
